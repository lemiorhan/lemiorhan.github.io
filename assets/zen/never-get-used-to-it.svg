    <path d="M682 474 L 682 486 M692 472 L 692 487 M701 476 L 701 488" fill="none" stroke-width="1.4" opacity="0.75"/>
    <circle cx="670" cy="524" r="1.6" fill="#24211e"/><circle cx="712" cy="532" r="1.3" fill="#24211e"/><circle cx="696" cy="538" r="1.1" fill="#24211e"/>
  </g>

  <rect width="800" height="640" fill="url(#vignette)"/>
</svg>
