      <path d="M404 548 C 396 520, 380 500, 390 470 C 398 448, 414 442, 416 430" stroke="#F2EDE3" stroke-width="6"/>
      <path d="M416 430 C 418 405, 400 390, 404 366 C 408 340, 418 322, 417 302" stroke-width="8"/>
