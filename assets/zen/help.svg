  <g transform="translate(-315 -180) scale(1.35)">
    <g filter="url(#pencil)" fill="none" stroke="#24211e" stroke-linecap="round" stroke-linejoin="round">
      <path d="M423 552 L423 160 L441 148 L441 552" fill="#F2EDE3" stroke-width="2.2"/>
      <path d="M434 552 L434 154 L441 148 L441 552 Z" fill="url(#hatch)" stroke="none" opacity="0.75"/>
      <path d="M423 160 L441 148" stroke-width="1.8"/>
      <path d="M428 530 C 429 430, 426 340, 428 200 M437 510 C 436 410, 438 300, 436 228" stroke-width="0.8" opacity="0.5"/>
      <ellipse cx="430" cy="372" rx="3" ry="7" stroke-width="1"/>

