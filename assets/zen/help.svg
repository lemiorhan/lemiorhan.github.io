      <path d="M396 520 C 386 498, 388 478, 396 462 M408 400 C 403 386, 404 372, 407 360" stroke-width="1.2" opacity="0.7"/>

      <path d="M408 424 C 408 415, 447 414, 447 425 C 447 436, 408 437, 408 428" fill="url(#hatch-light)" stroke-width="1.7"/>
      <path d="M447 426 C 457 434, 459 448, 452 464 M448 428 C 463 431, 471 441, 475 455" stroke-width="1.5"/>
      <circle cx="448" cy="426" r="3.2" fill="#24211e"/>
      <path d="M409 297 C 409 288, 447 287, 447 298 C 447 309, 409 310, 409 301" fill="url(#hatch-light)" stroke-width="1.7"/>
      <path d="M447 299 C 458 305, 462 318, 457 332 M448 301 C 462 302, 470 311, 474 323" stroke-width="1.5"/>
      <circle cx="448" cy="299" r="3.2" fill="#24211e"/>

      <path d="M408 252 C 392 238, 375 228, 356 214 M405 232 C 420 214, 436 202, 456 190 M398 206 C 396 192, 394 182, 392 166 M413 282 C 426 272, 438 266, 452 262 M380 230 C 372 214, 368 204, 366 192" stroke-width="2"/>

      <g stroke-width="1.3" fill="#F2EDE3">
        <use href="#leaf" transform="translate(356 214) rotate(-150)"/>
        <use href="#leaf" transform="translate(372 226) rotate(-110)"/>
        <use href="#leaf" transform="translate(386 236) rotate(160)" fill="url(#hatch)"/>
        <use href="#leaf" transform="translate(366 192) rotate(-95)"/>
        <use href="#leaf" transform="translate(456 190) rotate(-30)"/>
        <use href="#leaf" transform="translate(440 200) rotate(-75)" fill="url(#hatch)"/>
        <use href="#leaf" transform="translate(428 212) rotate(20)"/>
        <use href="#leaf" transform="translate(392 166) rotate(-80)"/>
        <use href="#leaf" transform="translate(394 180) rotate(-140)" fill="url(#hatch)"/>
        <use href="#leaf" transform="translate(395 178) rotate(-30)"/>
