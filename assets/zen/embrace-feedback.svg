      <use href="#pin" transform="translate(279 141) rotate(-38)"/>
      <use href="#pin" transform="translate(256 150) rotate(-70)"/>
      <use href="#pin" transform="translate(418 133) rotate(48)"/>
      <use href="#pin" transform="translate(446 143) rotate(70)"/>
      <use href="#pin" transform="translate(320 312) rotate(-24)"/>
