      <use href="#pin" transform="translate(400 314) rotate(22)"/>
      <use href="#pin" transform="translate(399 344) rotate(10)"/>
      <use href="#pin" transform="translate(246 416) rotate(-14)"/>
      <use href="#pin" transform="translate(270 418) rotate(12)"/>
      <use href="#pin" transform="translate(450 418) rotate(-10)"/>
      <use href="#pin" transform="translate(474 415) rotate(16)"/>
      <use href="#pin" transform="translate(308 440) rotate(-18)"/>
      <use href="#pin" transform="translate(334 442) rotate(4)"/>
      <use href="#pin" transform="translate(390 442) rotate(-6)"/>
      <use href="#pin" transform="translate(414 440) rotate(20)"/>
      <use href="#pin" transform="translate(318 178) rotate(-44)"/>
    </g>

    <path d="M556 486 L548 600 M704 486 L714 600 M628 492 L630 608" stroke-width="3.2"/>
    <path d="M550 470 L550 484 C 560 500, 700 500, 710 484 L 710 470" fill="url(#hatch)" stroke-width="2.2"/>
    <ellipse cx="630" cy="470" rx="80" ry="15" fill="#F6F1E6" stroke-width="2.4"/>

    <path d="M578 460 C 572 436, 588 418, 612 418 C 636 418, 652 436, 646 460 C 632 470, 592 470, 578 460 Z" fill="#E7E0D2" stroke-width="2.2"/>
    <path d="M578 460 C 572 436, 588 418, 612 418 C 636 418, 652 436, 646 460 C 632 470, 592 470, 578 460 Z" fill="url(#hatch-light)" stroke="none"/>
    <path d="M612 420 C 598 432, 594 452, 598 467 M612 420 C 626 432, 630 452, 626 467 M612 420 C 588 428, 578 444, 582 462" stroke-width="1.3" opacity="0.75"/>
    <path d="M604 418 L612 410 L620 418 L612 424 Z" fill="#24211e" stroke-width="1.4"/>
    <use href="#pin" transform="translate(596 428) rotate(-30)"/>
    <use href="#pin" transform="translate(620 424) rotate(10)"/>
    <use href="#pin" transform="translate(636 438) rotate(48)"/>

    <path d="M660 470 L708 464 L690 448 Z" fill="#F6F1E6" stroke-width="2"/>
    <path d="M660 470 L708 464 L708 469 L661 475 Z" fill="url(#hatch)" stroke-width="1.4"/>
  </g>

  <rect width="800" height="640" fill="url(#vignette)"/>
