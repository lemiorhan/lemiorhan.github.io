    <path d="M298 450 C 306 474, 414 474, 422 450" fill="url(#hatch-light)" stroke="none"/>

    <circle cx="360" cy="52" r="9" fill="url(#hatch)" stroke-width="2"/>
    <path d="M356 61 L356 72 L364 72 L364 61" stroke-width="1.8"/>
    <path d="M336 78 L336 122 L384 122 L384 78" fill="#E7E0D2" stroke-width="2.2"/>
    <ellipse cx="360" cy="78" rx="24" ry="6" fill="#F6F1E6" stroke-width="2"/>
    <path d="M374 84 L374 120" stroke-width="1" opacity="0.5"/>
    <path d="M376 84 L384 84 L384 122 L376 122 Z" fill="url(#hatch-light)" stroke="none"/>

    <use href="#jacket" fill="#F2EDE3" stroke-width="2.6"/>
    <use href="#jacket" fill="url(#hatch)" stroke="none"/>
    <use href="#jacket" fill="url(#hatch-cross)" stroke="none" opacity="0.75"/>
    <path d="M230 330 C 232 380, 236 410, 240 434 L 262 436 C 254 380, 248 300, 252 190 C 244 220, 232 270, 230 330 Z M490 330 C 488 380, 484 410, 480 434 L 466 436 C 470 380, 474 300, 470 196 C 480 230, 490 280, 490 330 Z" fill="url(#hatch-cross)" stroke="none" opacity="0.6"/>
    <path d="M288 216 C 286 200, 276 176, 262 158 M432 216 C 434 200, 444 176, 458 158" stroke-width="1.8"/>
  </g>

  <g clip-path="url(#jacket-clip)">
    <g filter="url(#smudge)" fill="#24211e">
      <use href="#jacket" opacity="0.4"/>
    </g>
  </g>

  <g filter="url(#pencil)" fill="none" stroke="#24211e" stroke-linecap="round" stroke-linejoin="round">

    <path d="M340 124 L380 124 L360 292 Z" fill="#E7E0D2" stroke-width="1.6"/>
    <path d="M340 124 L380 124 L360 292 Z" fill="url(#hatch-light)" stroke="none"/>
    <path d="M326 122 C 334 106, 386 106, 394 122 L 380 126 C 372 118, 348 118, 340 126 Z" fill="#E7E0D2" stroke-width="2"/>
    <path d="M340 124 L312 166 L324 175 L304 186 L360 292 Z M380 124 L408 166 L396 175 L416 186 L360 292 Z" fill="#F2EDE3" stroke-width="2.2"/>
    <path d="M340 124 L312 166 L324 175 L304 186 L360 292 Z M380 124 L408 166 L396 175 L416 186 L360 292 Z" fill="url(#hatch)" stroke="none" opacity="0.45"/>
    <path d="M360 292 L362 438 C 360 448, 354 454, 346 456" stroke-width="2.2"/>
    <circle cx="362" cy="306" r="6.5" fill="#24211e" stroke-width="1.4"/>
    <circle cx="363" cy="368" r="6.5" fill="#24211e" stroke-width="1.4"/>
    <path d="M296 396 L342 398 L342 410 L296 408 Z M384 398 L426 396 L426 408 L384 410 Z M392 216 L424 214 L424 222 L392 224 Z" fill="#E7E0D2" stroke-width="1.8"/>

    <g stroke="#F6F1E6" stroke-width="3.4" stroke-dasharray="8 6">
      <path d="M320 134 L252 158 M400 134 L468 158"/>
      <path d="M320 296 L322 370 M400 296 L398 370"/>
      <path d="M236 414 L282 418 M438 418 L484 414"/>
      <path d="M296 438 L350 442 M372 442 L426 438"/>
    </g>

    <g>
