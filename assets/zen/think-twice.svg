    <g stroke-width="1.8">
      <use href="#h1" transform="translate(180 664) scale(1.2)"/>
      <use href="#h3" transform="translate(276 664) scale(1.2)"/>
      <use href="#h1" transform="translate(394 664) scale(1.2)"/>
      <use href="#h2" transform="translate(492 664) scale(1.2)"/>
      <use href="#h1" transform="translate(608 664) scale(1.2)"/>
      <use href="#h3" transform="translate(708 664) scale(1.2)"/>
    </g>
  </g>

  <g filter="url(#shade)" fill="#24211e">
    <use href="#dart" transform="translate(250 470) rotate(9) scale(12 7.2)" opacity="0.78"/>
  </g>

  <g filter="url(#pencil)" fill="none" stroke="#24211e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 -10 L210 -10 L210 650 L-10 650 Z" fill="#E7E0D2" stroke-width="2.8"/>
