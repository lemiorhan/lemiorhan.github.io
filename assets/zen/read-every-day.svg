      <path d="M230 214 C 290 200, 340 226, 400 210 S 520 222, 570 204 V596 H230 Z M287 568 a175 130 0 1 0 350 0 a175 130 0 1 0 -350 0 Z" fill="url(#hatch)" fill-rule="evenodd"/>
