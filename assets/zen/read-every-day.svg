    <path d="M208 150 H230 V596 H208 Z M570 150 H592 V596 H570 Z" fill="url(#hatch-light)" stroke="none" opacity="0.5"/>
    <path d="M196 124 H236 V150 H196 Z M564 124 H604 V150 H564 Z" fill="#F2EDE3" stroke-width="2.4"/>
    <path d="M192 124 H240 M560 124 H608 M216 124 V150 M584 124 V150" stroke-width="2"/>
    <path d="M208 596 H592 V616 H208 Z" fill="url(#hatch)" stroke-width="2"/>
    <path d="M230 596 H570" stroke-width="2.6"/>
  </g>

