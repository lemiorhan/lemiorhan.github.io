    <path d="M436 452 L436 508 M444 452 L444 508" stroke-width="1.8"/>
    <ellipse cx="440" cy="510" rx="20" ry="5" fill="url(#hatch)" stroke-width="1.6"/>
    <path d="M476 437 L476 406" stroke-width="2"/>
    <ellipse cx="476" cy="437" rx="9" ry="3" fill="#24211e" stroke-width="1.4"/>
    <path d="M463 392 L489 392 L497 407 L455 407 Z" fill="url(#hatch)" stroke-width="2"/>
    <path d="M459 414 L450 426 M476 414 L476 428 M493 414 L502 426" stroke-width="1.3" opacity="0.7"/>
    <g stroke-width="1.4" transform="translate(422 440) scale(-1.55 1.55)">
      <path d="M-10 -16 C -10 -32, -4 -46, 6 -56 C 11 -53, 13 -49, 11 -45 C 16 -43, 17 -38, 12 -35 C 15 -32, 13 -27, 6 -24 C 2 -20, -4 -16, -10 -16 Z" fill="#F6F1E6"/>
      <path d="M-6 -22 C -4 -34, 0 -44, 6 -52 M-2 -22 C 2 -30, 6 -36, 11 -41" stroke-width="0.9" opacity="0.7"/>
      <use href="#bird-tail" fill="url(#hatch)"/>
      <use href="#bird-body" fill="#F2EDE3"/>
      <path d="M16 -30 L25 -32 L16 -26 Z M16 -23 L23 -19 L15 -21 Z" fill="#24211e"/>
      <circle cx="11" cy="-28" r="1.8" fill="#24211e"/>
      <path d="M0 -2 L-1 1 M5 -2 L6 1"/>
    </g>
    <g stroke-width="1.6">
      <use href="#bird" transform="translate(282 520) scale(1.3)"/>
      <use href="#bird" transform="translate(572 518) scale(-1.3 1.3)"/>
      <use href="#bird" transform="translate(338 544) scale(1.3)"/>
      <use href="#bird" transform="translate(534 544) scale(-1.3 1.3)"/>
      <use href="#bird" transform="translate(436 546) scale(1.3)"/>
    </g>

    <path d="M400 548 L400 110 M354 547.4 L354 297.4 C 354 187.4, 374.7 104, 393.6 110 M310 545.6 L310 295.6 C 310 185.6, 350.5 104, 387.4 110 M271 542.7 L271 292.7 C 271 182.7, 329 104, 382 110 M236.5 538.7 L236.5 288.7 C 236.5 178.7, 310 104, 377.1 110 M209.5 534 L209.5 284 C 209.5 174, 295.2 104, 373.3 110 M191 528.7 L191 278.7 C 191 168.7, 285 104, 370.7 110" stroke-width="2.2"/>
    <path d="M446 331.4 L446 297.4 C 446 187.4, 425.3 104, 406.4 110 M490 329.6 L490 295.6 C 490 185.6, 449.5 104, 412.6 110 M529 326.7 L529 292.7 C 529 182.7, 471 104, 418 110 M563.5 538.7 L563.5 288.7 C 563.5 178.7, 490 104, 422.9 110 M590.5 534 L590.5 284 C 590.5 174, 504.8 104, 426.7 110 M609 528.7 L609 278.7 C 609 168.7, 515 104, 429.3 110" stroke-width="2.2"/>
