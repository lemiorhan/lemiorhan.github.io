    <path d="M180 270 C 180 288, 290 298, 400 298 C 510 298, 620 288, 620 270" stroke-width="2.6"/>
    <path d="M400 332 C 450 332, 520 328, 563.5 322.7 M400 332 L400 548 M563.5 322.7 L563.5 538.7" stroke-width="3"/>

    <path d="M180 520 C 180 538, 290 548, 400 548 C 510 548, 620 538, 620 520 L628 550 C 628 568, 515 580, 400 580 C 285 580, 172 568, 172 550 Z" fill="#F2EDE3" stroke-width="2.4"/>
    <path d="M180 520 C 180 538, 290 548, 400 548 C 510 548, 620 538, 620 520 L628 550 C 628 568, 515 580, 400 580 C 285 580, 172 568, 172 550 Z" fill="url(#hatch)" stroke="none" opacity="0.75"/>
    <path d="M176 535 C 176 553, 288 563, 400 563 C 512 563, 624 553, 624 535" stroke-width="1.3" opacity="0.8"/>

    <ellipse cx="400" cy="106" rx="34" ry="9" fill="url(#hatch)" stroke-width="2.2"/>
    <ellipse cx="400" cy="90" rx="8" ry="7" fill="#F2EDE3" stroke-width="2"/>
    <circle cx="400" cy="64" r="18" stroke-width="3"/>

    <path d="M563.5 322.7 L692 306 L692 560 L563.5 538.7 M595.6 318.5 L595.6 544 M627.8 314.4 L627.8 549.4 M659.9 310.2 L659.9 554.7" stroke-width="2.4"/>
    <path d="M563.5 430.7 L692 433" stroke-width="1.8"/>
    <path d="M692 426 C 704 424, 708 436, 698 440" stroke-width="2"/>
  </g>

  <rect width="800" height="640" fill="url(#vignette)"/>
</svg>
