  <g fill="#24211e" font-family="'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-style="italic" text-anchor="middle">
    <text x="0" y="0" font-size="32" transform="translate(356 432) rotate(-1.5)" opacity="0.9">This</text>
    <text x="0" y="0" font-size="32" transform="translate(665 432) rotate(-1.5)" opacity="0.9">is London</text>
  </g>
